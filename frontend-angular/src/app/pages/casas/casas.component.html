<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div class="page-title mb-0">Casas</div>
  <div class="d-flex flex-wrap gap-2">
    <select class="form-select w-auto" *ngIf="esSuperAdmin" [(ngModel)]="tenantFiltro" [ngModelOptions]="{standalone: true}">
      <option value="">Todas las privadas</option>
      <option *ngFor="let t of tenants" [value]="t.id">{{ t.name }}</option>
    </select>
    <button class="btn btn-primary" (click)="abrirModal()"><i class="bi bi-plus-lg"></i> Nueva casa</button>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive tabla-tarjetas"><table class="table table-hover mb-0">
      <thead><tr><th *ngIf="esSuperAdmin">Privada</th><th>Número</th><th>Notas</th><th>Estado</th><th>Residentes</th></tr></thead>
      <tbody>
        <tr *ngFor="let c of casasVisibles">
          <td data-label="Privada" *ngIf="esSuperAdmin">{{ c.tenantName }}</td>
          <td data-label="Número">{{ c.number }}</td>
          <td data-label="Notas">{{ c.notes || '-' }}</td>
          <td data-label="Estado"><span class="badge" [ngClass]="'badge-estado-' + c.status">{{ c.status === 'Active' ? 'Activa' : 'Inactiva' }}</span></td>
          <td data-label="Residentes">{{ c.totalResidents }}</td>
        </tr>
        <tr *ngIf="!casasVisibles.length" class="fila-vacia"><td>Sin casas registradas.</td></tr>
      </tbody>
    </table></div>
  </div>
</div>

<div class="modal fade" id="modalCasa" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="form" (ngSubmit)="onGuardar()">
        <div class="modal-header"><h5 class="modal-title">Nueva casa</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>
          <div class="mb-2" *ngIf="esSuperAdmin">
            <label class="form-label">Privada</label>
            <select class="form-select" formControlName="tenantId" required>
              <option value="" disabled>Selecciona una privada</option>
              <option *ngFor="let t of tenants" [value]="t.id">{{ t.name }}</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Número / identificador</label><input type="text" class="form-control" formControlName="number" required></div>
          <div class="mb-2"><label class="form-label">Notas</label><textarea class="form-control" formControlName="notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button></div>
      </form>
    </div>
  </div>
</div>
